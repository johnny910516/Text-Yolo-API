column: 18 #直排字數
row: 20 #橫排字數
example format: true #是否為範例影像(example1.jpg)相同類型的稿紙
high school format: False  #是否為高中格式作文(聚有問題一及問題二的格式)
test mode: False #是否開啟測試模式(若開啟會將切割文字平均解析度低於閾值的影像過濾)
debug_mode: True #是否開啟偵錯模式(若關閉將不會在./output輸出影像及文字檔)
noise: False #空白格中是否有墨水滲透的痕跡(如example2.png)，若開起會將墨水滲透的部分過濾，但若無墨水滲透則須關閉




